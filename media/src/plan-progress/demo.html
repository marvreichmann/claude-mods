<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan Progress demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<script src="bar.js"></script>
<style>
  /* An 8.8 s clip of plan-progress in the Claude Code terminal, in the style
     of the clickable-links one. The bars are the plugin's own: bar.js is its
     hooks/bar.ts, and render(t) calls barCells() with the plugin's spring
     easing and 50 ms animation ticks, then paints the cells on a terminal
     grid, the band laid out as its AbovePrompt hook lays it out. */
  :root {
    --term: #16141f;
    --term-edge: #2c2840;
    --text: #e6e3ef;
    --dim: #8a8599;
    --accent: #d97757;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #3a2a6e 0%, transparent 55%),
                radial-gradient(circle at 80% 90%, #5a2a3e 0%, transparent 50%),
                linear-gradient(160deg, #1b1530, #0d0b18);
    font-family: var(--sans);
    color: var(--text);
    position: relative;
  }

  .headline {
    position: absolute; top: 30px; left: 0; right: 0;
    text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -0.02em;
    opacity: 0;
  }
  .headline em { font-style: normal; color: var(--accent); }

  .term {
    position: absolute; left: 110px; top: 96px; width: 1060px; height: 580px;
    background: var(--term); border: 1px solid var(--term-edge); border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    font-family: var(--mono); font-size: 21px; line-height: 31px;
  }
  .bar {
    height: 40px; border-bottom: 1px solid var(--term-edge);
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    font-family: var(--sans); font-size: 14px; line-height: 1; color: var(--dim);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3650; }
  .bar span { margin-left: 12px; }
  .body { position: absolute; top: 40px; left: 34px; right: 34px; bottom: 0; }
  .line { white-space: pre; height: 31px; }
  .dim { color: var(--dim); }
  .transcript { position: absolute; top: 16px; left: 0; right: 0; overflow: hidden; }
  #band { position: absolute; left: 0; }
  .input {
    position: absolute; left: 0; right: 0; top: 440px;
    border-top: 1px solid #45405c; border-bottom: 1px solid #45405c; padding: 6px 0; color: var(--dim);
  }
  .caret { display: inline-block; width: 11px; height: 22px; background: var(--dim); vertical-align: -4px; }
  .hint { position: absolute; left: 0; right: 0; top: 498px; white-space: pre; }

  .end {
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(160deg, rgba(27,21,48,.97), rgba(13,11,24,.98));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    opacity: 0;
  }
  .end h2 { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; }
  .end h2 em { font-style: normal; color: var(--accent); }
  .end p { font-size: 24px; color: #c9c4d8; }
  .chip {
    margin-top: 10px; font-family: var(--mono); font-size: 20px;
    background: #231f33; border: 1px solid var(--term-edge); border-radius: 10px; padding: 12px 22px;
  }
  .chip b { color: var(--accent); font-weight: 400; }
</style>
</head>
<body>
  <div class="headline" id="h0">Claude's plan, <em>right above the prompt</em></div>
  <div class="headline" id="h1">Particles <em>flow</em> toward the stage</div>
  <div class="headline" id="h2">Plans and task lists, <em>side by side</em></div>
  <div class="headline" id="h3">Green when it's <em>done</em></div>

  <div class="term" id="term">
    <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>~/shop — claude</span></div>
    <div class="body" id="body">
      <div class="transcript" id="transcript"></div>
      <canvas id="band"></canvas>
      <div class="input">&gt; <span class="caret"></span></div>
      <div class="hint dim">  ? for shortcuts</div>
    </div>
  </div>

  <div class="end" id="end">
    <h2>Plan <em>Progress</em></h2>
    <p>Live progress bars above the Claude Code prompt.</p>
    <div class="chip"><b>/plugin install</b> plan-progress@reichmann-mods</div>
  </div>

<script>
  window.DURATION = 8.8
  const { barCells, progressOf } = PlanBar

  // Two bars: a staged plan (the plugin's own demo plan) and a task list,
  // which the plugin shows as a one-stage plan named Tasks. Each advances one
  // step at the listed times, as `progress` calls and TaskUpdate would.
  const BARS = [
    { id: 'release', title: 'Release pipeline', shownAt: 0.4,
      stages: [['Build', 3], ['Test', 4], ['Deploy', 2]],
      advances: [1.0, 1.55, 2.1, 2.65, 3.2, 3.75, 4.3, 4.85, 5.5] },
    { id: 'notes', title: 'Write release notes', shownAt: 2.0,
      stages: [['Tasks', 4]],
      advances: [2.7, 3.7, 4.7, 5.7] },
  ]
  const dim = text => `<span class="dim">${text}</span>`
  const TRANSCRIPT = [
    [0.0, [dim('&gt; ship the release: build, test, deploy, write the notes')]],
    [0.3, ['', "● I'll track the release as a plan."]],
    [0.9, ['', '● Bash(npm run build)']],
    [2.0, ['', '● TaskCreate(4 tasks)']],
    [2.6, [dim('  ⎿  Build finished in 41s')]],
    [3.2, ['', '● Bash(npm test)']],
    [4.3, [dim('  ⎿  128 passed')]],
    [4.6, ['', '● Bash(npm run deploy)']],
    [5.5, [dim('  ⎿  Deployed v2.4.0')]],
    [6.0, ['', '● Released v2.4.0, notes in RELEASE_NOTES.md.']],
  ]
  const HEADLINES = [[0.1, 2.0], [2.1, 3.9], [4.0, 5.6], [5.7, 7.1]]
  const END_AT = 7.2

  const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x))
  const ease = x => 1 - Math.pow(1 - clamp(x), 3)
  const fade = (t, from, to, edge = 0.2) => clamp(Math.min((t - from) / edge, (to - t) / edge))

  // The plan as the plugin holds it at time t: steps done per stage, the current stage, done.
  const planAt = (bar, t) => {
    let left = bar.advances.filter(at => t >= at).length
    const stages = bar.stages.map(([name, total]) => {
      const done = Math.min(total, left)
      left -= done
      return { name, total, done }
    })
    const current = Math.max(0, stages.findIndex(s => s.done < s.total))
    const isDone = stages.every(s => s.done === s.total)
    return { id: bar.id, title: bar.title, stages, current: isDone ? stages.length - 1 : current, status: isDone ? 'done' : 'active' }
  }

  // register.tsx's frame timer: a near-critically damped spring, stepped 60 times a second.
  const shownAt = (bar, t) => {
    let to = 0, v = 0
    for (let step = 0; step < Math.round((t - bar.shownAt) * 60); step++) {
      const target = progressOf(planAt(bar, bar.shownAt + step / 60))
      v = v * 0.6 + (target - to) * 0.06
      const settled = Math.abs(target - to) < 0.002 && Math.abs(v) < 0.001
      to = settled ? target : Math.min(1, Math.max(0, to + v))
      if (settled) v = 0
    }
    return to
  }

  const hex = n => `#${n.toString(16).padStart(6, '0')}`
  let CW = 12.6
  const CH = 31

  // Paints one terminal cell: a background, then its character as a terminal draws it.
  const paintCell = (ctx, col, row, ch, fg, bg) => {
    const x = col * CW, y = row * CH
    if (bg !== undefined) { ctx.fillStyle = bg; ctx.fillRect(x, y, CW + 0.5, CH) }
    ctx.fillStyle = fg
    if (ch >= 0x2800 && ch <= 0x28ff) {
      const bits = ch - 0x2800
      const BRAILLE = [[0x01, 0x02, 0x04, 0x40], [0x08, 0x10, 0x20, 0x80]]
      for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 4; dy++) {
        if (!(bits & BRAILLE[dx][dy])) continue
        ctx.beginPath()
        ctx.arc(x + CW * (0.3 + 0.4 * dx), y + CH * (0.2 + 0.2 * dy), CW * 0.12, 0, Math.PI * 2)
        ctx.fill()
      }
    } else if (ch >= 0x2589 && ch <= 0x258f) {
      ctx.fillRect(x, y, CW * ((0x2590 - ch) / 8), CH)
    } else if (ch === 0x2502 || ch === 0x2575) {
      ctx.fillRect(x + CW / 2 - 0.75, y, 1.5, ch === 0x2502 ? CH : CH / 2)
    } else if (ch !== 0x20 && ch !== 0) {
      ctx.fillText(String.fromCodePoint(ch), x, y + CH * 0.72)
    }
  }
  const paintText = (ctx, col, row, text, fg) => {
    Array.from(text).forEach((c, i) => paintCell(ctx, col + i, row, c.codePointAt(0), fg))
  }

  // The AbovePrompt band: a round grey border, one row per bar (register.tsx 470-512).
  const drawBand = t => {
    const canvas = document.getElementById('band')
    const ctx = canvas.getContext('2d')
    const body = document.getElementById('body')
    const columns = Math.floor(body.clientWidth / CW)
    const inner = Math.max(20, columns - 4)
    const titleWidth = Math.max(10, Math.min(32, Math.floor(inner * 0.26)))
    const width = Math.max(8, inner - titleWidth - 10)
    const rows = BARS.filter(bar => t >= bar.shownAt)
    canvas.width = columns * CW
    canvas.height = (rows.length + 2) * CH
    canvas.style.top = `${434 - canvas.height}px`
    canvas.style.display = rows.length ? 'block' : 'none'
    ctx.font = `21px 'JetBrains Mono'`
    const grey = '#808080', dimGrey = '#8a8599', text = '#e6e3ef'
    const last = columns - 1
    paintText(ctx, 0, 0, `╭${'─'.repeat(columns - 2)}╮`, grey)
    paintText(ctx, 0, rows.length + 1, `╰${'─'.repeat(columns - 2)}╯`, grey)
    rows.forEach((bar, i) => {
      const row = i + 1
      ctx.globalAlpha = clamp((t - bar.shownAt) / 0.25)
      paintText(ctx, 0, row, '│', grey)
      paintText(ctx, last, row, '│', grey)
      const plan = planAt(bar, t)
      const color = plan.status === 'done' ? '#34b36f' : PlanBar.runningHex()
      let col = 2
      paintText(ctx, col, row, plan.status === 'done' ? '✓' : '●', color)
      col += 2
      const title = plan.title.length > titleWidth ? plan.title.slice(0, titleWidth - 1) + '…' : plan.title
      paintText(ctx, col, row, title, text)
      col += titleWidth + 1
      const cells = barCells(plan, width, shownAt(bar, t), t * 20, 'flow')
      for (let x = 0; x < width; x++) paintCell(ctx, col + x, row, cells[x * 3], hex(cells[x * 3 + 1]), hex(cells[x * 3 + 2]))
      col += width + 1
      paintText(ctx, col, row, `${Math.round(progressOf(plan) * 100)}%`.padStart(4), dimGrey)
      col += 5
      paintText(ctx, col, row, '×', dimGrey)
      ctx.globalAlpha = 1
    })
  }

  window.seek = t => {
    const term = document.getElementById('term')
    term.style.opacity = ease(t / 0.5)
    term.style.transform = `translateY(${(1 - ease(t / 0.5)) * 14}px)`
    HEADLINES.forEach(([from, to], i) => {
      const el = document.getElementById(`h${i}`)
      const o = fade(t, from, to)
      el.style.opacity = o
      el.style.transform = `translateY(${(1 - o) * 8}px)`
    })
    document.getElementById('end').style.opacity = clamp((t - END_AT) / 0.35)

    drawBand(t)
    // the transcript ends just above the band
    const band = document.getElementById('band')
    const room = Math.floor((434 - (band.style.display === 'none' ? 0 : band.height) - 16) / CH)
    const lines = []
    for (const [at, add] of TRANSCRIPT) if (t >= at) lines.push(...add)
    document.getElementById('transcript').innerHTML = lines.slice(-room)
      .map(line => `<div class="line">${line === '' ? ' ' : line}</div>`).join('')
  }

  window.ready = document.fonts.ready.then(() => {
    const ctx = document.getElementById('band').getContext('2d')
    ctx.font = `21px 'JetBrains Mono'`
    CW = ctx.measureText('M').width
    seek(0)
  })
</script>
</body>
</html>
