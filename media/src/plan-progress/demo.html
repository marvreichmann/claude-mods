<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan Progress demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  /* An 8.6 s clip of plan-progress in the Claude Code terminal, in the style
     of the clickable-links one. The terminal draws each task as one text row
     (register.tsx, the AbovePrompt hook without Svg): state glyph, title, a
     25-cell ━/─ bar, "Stage step/size", percent, ✕. render(t) below draws
     every moment, since the rows change as text. */
  :root {
    --term: #16141f;
    --term-edge: #2c2840;
    --text: #e6e3ef;
    --dim: #8a8599;
    --accent: #d97757;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #3a2a6e 0%, transparent 55%),
                radial-gradient(circle at 80% 90%, #5a2a3e 0%, transparent 50%),
                linear-gradient(160deg, #1b1530, #0d0b18);
    font-family: var(--sans);
    color: var(--text);
    position: relative;
  }

  .headline {
    position: absolute; top: 30px; left: 0; right: 0;
    text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -0.02em;
    opacity: 0;
  }
  .headline em { font-style: normal; color: var(--accent); }

  .term {
    position: absolute; left: 110px; top: 96px; width: 1060px; height: 580px;
    background: var(--term); border: 1px solid var(--term-edge); border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    font-family: var(--mono); font-size: 21px; line-height: 31px;
  }
  .bar {
    height: 40px; border-bottom: 1px solid var(--term-edge);
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    font-family: var(--sans); font-size: 14px; line-height: 1; color: var(--dim);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3650; }
  .bar span { margin-left: 12px; }
  .body { position: absolute; top: 40px; left: 34px; right: 34px; bottom: 0; }
  .line { white-space: pre; height: 31px; }
  .dim { color: var(--dim); }
  .transcript { position: absolute; top: 18px; left: 0; right: 0; height: 248px; overflow: hidden; }
  .dialog { border: 1px solid #6a5a9a; border-radius: 6px; padding: 0 14px; margin: 2px 0 2px 26px; width: 520px; }
  .dialog .title { color: #a58ff0; font-weight: 700; }
  .band { position: absolute; left: 0; right: 0; top: 296px; }
  .row { display: flex; gap: 0.6em; white-space: pre; height: 31px; } /* gap={1}: one cell */
  .row .title { flex: 1; overflow: hidden; }
  .input {
    position: absolute; left: 0; right: 0; top: 404px;
    border-top: 1px solid #45405c; border-bottom: 1px solid #45405c; padding: 6px 0; color: var(--dim);
  }
  .caret { display: inline-block; width: 11px; height: 22px; background: var(--dim); vertical-align: -4px; }
  .modes { position: absolute; left: 0; right: 0; top: 462px; display: flex; white-space: pre; }
  .modes .hint { margin-left: auto; }

  .end {
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(160deg, rgba(27,21,48,.97), rgba(13,11,24,.98));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    opacity: 0;
  }
  .end h2 { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; }
  .end h2 em { font-style: normal; color: var(--accent); }
  .end p { font-size: 24px; color: #c9c4d8; }
  .chip {
    margin-top: 10px; font-family: var(--mono); font-size: 20px;
    background: #231f33; border: 1px solid var(--term-edge); border-radius: 10px; padding: 12px 22px;
  }
  .chip b { color: var(--accent); font-weight: 400; }
</style>
</head>
<body>
  <div class="headline" id="h0">Claude's plan, <em>right above the prompt</em></div>
  <div class="headline" id="h1">One bar <em>per task</em></div>
  <div class="headline" id="h2">Amber when it <em>needs you</em></div>
  <div class="headline" id="h3">Green when it's <em>done</em></div>

  <div class="term" id="term">
    <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>~/checkout-service — claude</span></div>
    <div class="body">
      <div class="transcript" id="transcript"></div>
      <div class="band" id="band"></div>
      <div class="input">&gt; <span class="caret"></span></div>
      <div class="modes"><span id="toggle"></span><span class="hint dim">? for shortcuts</span></div>
    </div>
  </div>

  <div class="end" id="end">
    <h2>Plan <em>Progress</em></h2>
    <p>Live progress bars above the Claude Code prompt.</p>
    <div class="chip"><b>/plugin install</b> plan-progress@reichmann-mods</div>
  </div>

<script>
  window.DURATION = 8.6

  // The mod's own state colors and glyphs (register.tsx STATE_COLOR, STATE_GLYPH).
  const COLOR = { running: '#7858CA', needs_input: '#AD6400', done: '#18883A' }
  const GLYPH = { running: '●', needs_input: '?', done: '✓' }
  const CELLS = 25

  const TASKS = [
    {
      title: 'Checkout flow', shownAt: 0.5,
      stages: [['Explore', 2], ['Build', 3], ['Verify', 2]],
      stepsDoneAt: [1.6, 2.4, 3.2, 5.0, 5.4, 5.8, 6.2],
      needsInput: [3.6, 4.8],
    },
    {
      title: 'Release notes', shownAt: 2.3,
      stages: [['Collect', 2], ['Draft', 2]],
      stepsDoneAt: [3.2, 3.9, 5.0, 6.0],
    },
  ]

  // What Claude writes meanwhile; the transcript shows the newest lines that fit.
  const dim = text => `<span class="dim">${text}</span>`
  const TRANSCRIPT = [
    [0.0, [dim('&gt; refactor the checkout flow and draft the release notes')]],
    [0.3, ['', "● I'll track this as two tasks."]],
    [0.8, ['', '● Task(Map payment routes)']],
    [1.6, [dim('  ⎿  Done (6 tool uses · 18s)')]],
    [2.4, ['', '● Task(Collect merged PRs)']],
    [3.0, ['', '● Bash(npm run migrate)']],
    [3.6, [{ dialog: true, until: 4.8 }]],
    [4.8, [dim('  ⎿  Applied 3 migrations')]],
    [5.0, ['', '● Update(src/checkout/cart.ts)']],
    [5.4, [dim('  ⎿  Updated with 12 additions')]],
    [6.0, ['', '● Write(RELEASE_NOTES.md)']],
    [6.4, ['', '● Both tasks are done.']],
  ]
  const DIALOG = `<div class="dialog"><div class="line title">Bash command</div><div class="line">  npm run migrate</div><div class="line">Do you want to proceed?</div><div class="line">❯ 1. Yes</div><div class="line dim">  2. No</div></div>`
  const DIALOG_LINES = 5.4
  const VISIBLE_LINES = 8

  const HEADLINES = [[0.1, 2.2], [2.3, 3.5], [3.6, 4.9], [5.0, 6.8]]
  const END_AT = 6.9

  const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x))
  const ease = x => 1 - Math.pow(1 - clamp(x), 3)
  const fade = (t, from, to, edge = 0.2) => clamp(Math.min((t - from) / edge, (to - t) / edge))
  const esc = s => s.replace(/&(?!\w+;)/g, '&amp;')

  // One task row exactly as the terminal draws it.
  const rowOf = (task, t) => {
    const total = task.stages.reduce((sum, [, n]) => sum + n, 0)
    const done = task.stepsDoneAt.filter(at => t >= at).length
    const isDone = done === total
    const needs = task.needsInput && t >= task.needsInput[0] && t < task.needsInput[1]
    const state = isDone ? 'done' : needs ? 'needs_input' : 'running'
    const pct = isDone ? 100 : Math.round((done / total) * 100)
    // where(): the first unfinished step, or the last one when all are done
    const at = Math.min(done, total - 1)
    let seen = 0, stage = '', step = 0, size = 0
    for (const [name, n] of task.stages) {
      if (at < seen + n) { stage = name; step = at - seen + 1; size = n; break }
      seen += n
    }
    const full = Math.round(pct / 4)
    const color = COLOR[state]
    return `<div class="row" style="opacity:${clamp((t - task.shownAt) / 0.3)}">` +
      `<span style="color:${color}">${GLYPH[state]}</span><span class="title">${task.title}</span>` +
      `<span><span style="color:${color}">${'━'.repeat(full)}</span><span class="dim">${'─'.repeat(CELLS - full)}</span>` +
      `<span style="color:${color}"> ${stage} ${step}/${size}</span></span>` +
      `<span class="dim">${String(pct).padStart(3, ' ')}%</span><span class="dim">✕</span></div>`
  }

  window.seek = t => {
    const term = document.getElementById('term')
    term.style.opacity = ease(t / 0.5)
    term.style.transform = `translateY(${(1 - ease(t / 0.5)) * 14}px)`
    HEADLINES.forEach(([from, to], i) => {
      const el = document.getElementById(`h${i}`)
      const o = fade(t, from, to)
      el.style.opacity = o
      el.style.transform = `translateY(${(1 - o) * 8}px)`
    })
    document.getElementById('end').style.opacity = clamp((t - END_AT) / 0.35)

    // newest lines that fit, a dialog counting as its height
    const blocks = []
    for (const [at, lines] of TRANSCRIPT) {
      if (t < at) break
      for (const line of lines) {
        if (typeof line === 'object') { if (t < line.until) blocks.push([DIALOG, DIALOG_LINES]) }
        else blocks.push([`<div class="line">${line === '' ? ' ' : esc(line)}</div>`, 1])
      }
    }
    let room = VISIBLE_LINES
    const shown = []
    for (const [html, height] of blocks.reverse()) {
      if (height > room) break
      shown.unshift(html)
      room -= height
    }
    document.getElementById('transcript').innerHTML = shown.join('')

    const visible = TASKS.filter(task => t >= task.shownAt - 0.05)
    document.getElementById('band').innerHTML = visible.map(task => rowOf(task, t)).join('<div class="row"> </div>')
    // the SessionMode button: [ Progress ] with one bar, [ Progress 2 ] with two
    document.getElementById('toggle').textContent = visible.length > 1 ? '[ Progress 2 ]' : '[ Progress ]'
  }

  window.ready = document.fonts.ready.then(() => seek(0))
</script>
</body>
</html>
