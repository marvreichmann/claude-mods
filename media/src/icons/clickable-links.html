<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clickable-links icon</title>
<style>
  /* 512x512 listing icon: an underlined link with the pointer clicking it. */
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f52"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#5a3fb0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5a3fb0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- two chain links -->
  <g fill="none" stroke="#8fb8ff" stroke-width="30" stroke-linecap="round">
    <path d="M232 190 l26 -26 a58 58 0 0 1 82 82 l-40 40 a58 58 0 0 1 -82 0"/>
    <path d="M262 304 l-26 26 a58 58 0 0 1 -82 -82 l40 -40 a58 58 0 0 1 82 0"/>
  </g>
  <!-- the click ring and the pointer -->
  <circle cx="330" cy="342" r="46" fill="none" stroke="#d97757" stroke-width="10" opacity=".9"/>
  <path d="M330 342 l0 118 l30 -28 l22 48 l26 -12 l-22 -48 l42 -4 z" fill="#ffffff" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
</svg>
</body>
</html>
